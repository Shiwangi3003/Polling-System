<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cast your vote · QPoll</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#15231f;--muted:#708079;--line:#e4ebe7;--green:#176b50;--pale:#edf5f0;--paper:#fbfcfa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px 'DM Sans',sans-serif}.shell{max-width:1040px;margin:auto;padding:0 26px}.nav{height:76px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font:800 20px Manrope,sans-serif;letter-spacing:-.7px;text-decoration:none;color:var(--ink);display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;background:var(--green);color:white;border-radius:11px;display:grid;place-items:center}.nav a:last-child{color:var(--muted);text-decoration:none;font-size:13px}.layout{max-width:660px;margin:74px auto}.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--green);font-weight:700}.card{margin-top:14px;background:white;border:1px solid var(--line);border-radius:16px;padding:34px;box-shadow:0 14px 40px #183c2a09}.card h1{font:750 27px/1.35 Manrope,sans-serif;letter-spacing:-.8px;margin:8px 0 10px}.sub{color:var(--muted);font-size:14px;margin:0 0 24px}.option{display:flex;align-items:center;gap:14px;padding:15px;border:1px solid var(--line);border-radius:10px;margin:10px 0;cursor:pointer;transition:.15s}.option:hover{border-color:#8bb7a0;background:#fcfffd}.option:has(input:checked){border-color:var(--green);background:#f5faf6}.option input{accent-color:var(--green);width:17px;height:17px;margin:0}.option span{font-size:14px}.actions{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:25px;padding-top:20px}.privacy{color:var(--muted);font-size:12px}.btn{border:0;border-radius:8px;background:var(--green);color:white;padding:12px 18px;font-weight:700;cursor:pointer}.btn:hover{background:#10563f}.btn:disabled{opacity:.6;cursor:wait}.message{font-size:13px;color:var(--green);margin-top:14px;min-height:18px}.footer{margin:0 auto;max-width:660px;color:var(--muted);font-size:11px;padding:20px 0;border-top:1px solid var(--line)}@media(max-width:560px){.shell{padding:0 16px}.layout{margin:38px auto}.card{padding:24px 20px}.card h1{font-size:23px}.privacy{max-width:130px;line-height:1.5}}
</style></head><body><div class="shell"><header class="nav"><a class="brand" href="/"><span class="mark">✳</span>QPoll</a><a href="/">← Back to home</a></header>
<main class="layout"><div class="eyebrow">Community poll</div><form class="card" id="pollForm"><h1 id="question">{{ details["question"] }}</h1><p class="sub">Choose the answer that feels right to you.</p><div id="options"></div><div class="actions"><span class="privacy">Your response helps shape the result.</span><button class="btn" type="submit">Submit vote <span aria-hidden="true">→</span></button></div><div class="message" id="message" role="status" aria-live="polite"></div></form><div class="footer">QPoll · Make decisions together</div></main></div>
<script>const poll={{ details | tojson }};const options=document.getElementById('options');(poll.options||[]).forEach((text,index)=>{const label=document.createElement('label');label.className='option';const radio=document.createElement('input');radio.type='radio';radio.name='pollOption';radio.value=index;radio.required=true;const name=document.createElement('span');name.textContent=text;label.append(radio,name);options.append(label)});document.getElementById('pollForm').addEventListener('submit',async e=>{e.preventDefault();const selected=document.querySelector('input[name="pollOption"]:checked');if(!selected)return;const button=e.submitter;const message=document.getElementById('message');button.disabled=true;button.textContent='Submitting…';try{const response=await fetch('/submit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({poll_id:poll.poll_id,pollOption:Number(selected.value)})});const data=await response.json();if(!response.ok)throw new Error(data.msg||data.detail||'Your vote could not be submitted.');message.textContent='Thanks — your vote has been counted.';setTimeout(()=>location.href='/poll/result/'+encodeURIComponent(poll.poll_id),900)}catch(error){message.textContent=error.message;button.disabled=false;button.innerHTML='Submit vote <span aria-hidden="true">→</span>'}});</script></body></html>
