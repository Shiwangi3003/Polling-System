<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Poll results · QPoll</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--ink:#15231f;--muted:#708079;--line:#e4ebe7;--green:#176b50;--pale:#edf5f0;--paper:#fbfcfa}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px 'DM Sans',sans-serif}.shell{max-width:1040px;margin:auto;padding:0 26px}.nav{height:76px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.brand{font:800 20px Manrope,sans-serif;letter-spacing:-.7px;text-decoration:none;color:var(--ink);display:flex;gap:10px;align-items:center}.mark{width:34px;height:34px;background:var(--green);color:white;border-radius:11px;display:grid;place-items:center}.nav a:last-child{color:var(--muted);text-decoration:none;font-size:13px}.layout{max-width:760px;margin:60px auto}.eyebrow{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--green);font-weight:700}.card{margin-top:14px;background:white;border:1px solid var(--line);border-radius:16px;padding:32px;box-shadow:0 14px 40px #183c2a09}.top{display:flex;justify-content:space-between;align-items:center;gap:18px;padding-bottom:24px;border-bottom:1px solid var(--line)}h1{font:750 25px/1.35 Manrope,sans-serif;letter-spacing:-.8px;margin:8px 0}.sub{font-size:13px;color:var(--muted);margin:0}.total{text-align:right;flex:none}.total b{font:800 24px Manrope;display:block}.total span{font-size:11px;color:var(--muted)}.results{padding-top:25px}.result-row{margin:0 0 22px}.result-info{display:flex;justify-content:space-between;gap:12px;margin-bottom:8px;font-size:13px}.result-info span:last-child{font-weight:700;color:#34453c}.track{width:100%;height:9px;background:#edf1ee;border-radius:20px;overflow:hidden}.bar{height:100%;border-radius:20px;background:var(--green);transition:width .5s}.result-row:nth-child(3n+2) .bar{background:#4d9274}.result-row:nth-child(3n) .bar{background:#8cb69d}.empty{padding:24px;background:#f6f8f6;color:var(--muted);font-size:13px;border-radius:10px}.foot-actions{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding-top:19px;margin-top:23px}.foot-actions span{color:var(--muted);font-size:12px}.btn{border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:10px 14px;text-decoration:none;font-weight:700;font-size:12px}.btn.primary{background:var(--green);border-color:var(--green);color:white}.footer{margin:0 auto;max-width:760px;color:var(--muted);font-size:11px;padding:20px 0;border-top:1px solid var(--line)}@media(max-width:560px){.shell{padding:0 16px}.layout{margin:38px auto}.card{padding:23px 19px}.top{align-items:flex-start;flex-direction:column}.total{text-align:left}.foot-actions{align-items:flex-start;gap:14px;flex-direction:column}}
</style></head><body><div class="shell"><header class="nav"><a class="brand" href="/"><span class="mark">✳</span>QPoll</a><a href="/">← Back to home</a></header><main class="layout"><div class="eyebrow">Poll results</div><section class="card"><div class="top"><div><h1>{{ details["question"] }}</h1><p class="sub">Here’s how the group responded.</p></div><div class="total"><b>{{ totalCount }}</b><span>{% if totalCount == 1 %}response{% else %}responses{% endif %}</span></div></div><div class="results" id="results"></div><div class="foot-actions"><span>Results update as people vote.</span><a class="btn primary" href="/polls/{{ details['poll_id'] }}">Cast a vote <span>→</span></a></div></section><div class="footer">QPoll · Make decisions together</div></main></div>
<script>const poll={{ details | tojson }};const root=document.getElementById('results');const choices=poll.options||[];const values=(poll.response||[]).map(Number);if(!Number({{ totalCount }})){const empty=document.createElement('div');empty.className='empty';empty.textContent='No votes yet. Be the first to share your choice.';root.append(empty)}else{choices.forEach((choice,index)=>{const row=document.createElement('div');row.className='result-row';const info=document.createElement('div');info.className='result-info';const label=document.createElement('span');label.textContent=choice;const percentage=document.createElement('span');percentage.textContent=(Number(values[index]||0)).toFixed(1)+'%';info.append(label,percentage);const track=document.createElement('div');track.className='track';const bar=document.createElement('div');bar.className='bar';bar.style.width=Math.min(100,Math.max(0,Number(values[index]||0)))+'%';track.append(bar);row.append(info,track);root.append(row)})}</script></body></html>
